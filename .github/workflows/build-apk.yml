name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # The repo keeps only lib/ and config; generate the Android scaffold here.
      - name: Generate Android project
        run: flutter create . --platforms=android --project-name mal_sanau --org kz.malsanau
      # flutter create adds a template widget test that does not match this app.
      - run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: mal-sanau-apk
          path: build/app/outputs/flutter-apk/app-release.apk
