name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # The repo keeps only lib/ and config; generate the Android scaffold here.
      - name: Generate Android project
        run: flutter create . --platforms=android --project-name mal_sanau --org kz.malsanau
      # flutter create adds a template widget test that does not match this app.
      - run: rm -f test/widget_test.dart
      - run: flutter pub get
      # Some plugins pin an old compileSdk; raise it so the build links.
      # AGP 9 new DSL breaks older plugins (video_thumbnail); opt out.
      - run: echo 'android.newDsl=false' >> android/gradle.properties
      - name: Raise plugin compileSdk and app minSdk
        run: |
          find "$PUB_CACHE/hosted" -path '*/android/build.gradle' -print0 | xargs -0 -r sed -i -E 's/compileSdk(Version)?[ =]+[0-9]+/compileSdk 36/'
          find "$PUB_CACHE/hosted" -path '*/android/build.gradle.kts' -print0 | xargs -0 -r sed -i -E 's/compileSdk(Version)?[ =]+[0-9]+/compileSdk = 36/'
          sed -i -E 's/minSdk(Version)?( =)? *flutter\.minSdkVersion/minSdk = 26/' android/app/build.gradle.kts || true
          sed -i -E 's/minSdkVersion flutter\.minSdkVersion/minSdkVersion 26/' android/app/build.gradle || true
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: mal-sanau-apk
          path: build/app/outputs/flutter-apk/app-release.apk
